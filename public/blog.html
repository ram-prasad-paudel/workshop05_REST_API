<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | Blog API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #333; }
    nav { background: #2563eb; padding: 1rem 2rem; display: flex; gap: 1.5rem; }
    nav a { color: #fff; text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 2rem; margin-bottom: 1.5rem; }
    h2 { font-size: 1.3rem; margin-bottom: .8rem; }

    /* Create form */
    .card { background: #fff; border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .form-group { display: flex; flex-direction: column; gap: .5rem; margin-bottom: .8rem; }
    label { font-weight: 600; font-size: .9rem; }
    input, textarea { padding: .55rem .75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    textarea { resize: vertical; min-height: 90px; }
    .btn { background: #2563eb; color: #fff; border: none; padding: .6rem 1.4rem; border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: 600; }
    .btn:hover { background: #1d4ed8; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-warning { background: #d97706; }
    .btn-warning:hover { background: #b45309; }

    /* Posts list */
    #posts-container .post-card {
      background: #fff;
      border-radius: 10px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .post-card h3 { font-size: 1.1rem; margin-bottom: .3rem; }
    .post-card .meta { font-size: .8rem; color: #666; margin-bottom: .5rem; }
    .post-card p { line-height: 1.5; margin-bottom: .8rem; }
    .post-card .actions { display: flex; gap: .6rem; }
    #status { margin-top: .5rem; padding: .5rem .8rem; border-radius: 6px; font-size: .9rem; display: none; }
    #status.success { background: #dcfce7; color: #166534; display: block; }
    #status.error   { background: #fee2e2; color: #991b1b; display: block; }
    .empty { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
    <a href="/blog">Blog</a>
  </nav>

  <main>
    <h1>Blog Posts 📝</h1>

    <!-- ── Create Post Form ───────────────────────────────── -->
    <div class="card">
      <h2>Create New Post</h2>
      <div class="form-group">
        <label for="title">Title</label>
        <input id="title" type="text" placeholder="Post title" />
      </div>
      <div class="form-group">
        <label for="content">Content</label>
        <textarea id="content" placeholder="Write something..."></textarea>
      </div>
      <div class="form-group">
        <label for="author">Author</label>
        <input id="author" type="text" placeholder="Your name" />
      </div>
      <button class="btn" onclick="createPost()">Create Post</button>
      <div id="status"></div>
    </div>

    <!-- ── Posts List ─────────────────────────────────────── -->
    <div class="card">
      <h2>All Posts</h2>
      <button class="btn" onclick="loadPosts()" style="margin-bottom:1rem">↻ Refresh</button>
      <div id="posts-container"><p class="empty">Click Refresh to load posts.</p></div>
    </div>
  </main>

  <script>
    const API = '/api/posts';

    function showStatus(msg, type = 'success') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = type;
    }

    // ── Create Post ──────────────────────────────────────────
    async function createPost() {
      const body = {
        title:   document.getElementById('title').value,
        content: document.getElementById('content').value,
        author:  document.getElementById('author').value,
      };
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Unknown error');
        showStatus(`✅ Post created! ID: ${data._id}`, 'success');
        document.getElementById('title').value = '';
        document.getElementById('content').value = '';
        document.getElementById('author').value = '';
        loadPosts();
      } catch (err) {
        showStatus(`❌ ${err.message}`, 'error');
      }
    }

    // ── Load All Posts ───────────────────────────────────────
    async function loadPosts() {
      const container = document.getElementById('posts-container');
      container.innerHTML = '<p class="empty">Loading...</p>';
      try {
        const res = await fetch(API);
        const posts = await res.json();
        if (!posts.length) {
          container.innerHTML = '<p class="empty">No posts yet. Create one above!</p>';
          return;
        }
        container.innerHTML = posts.map(renderPost).join('');
      } catch (err) {
        container.innerHTML = `<p class="empty">Error: ${err.message}</p>`;
      }
    }

    // ── Render one post card ─────────────────────────────────
    function renderPost(post) {
      const date = new Date(post.createdAt).toLocaleString();
      return `
        <div class="post-card" id="post-${post._id}">
          <h3>${escHtml(post.title)}</h3>
          <div class="meta">By ${escHtml(post.author)} · ${date}</div>
          <p>${escHtml(post.content)}</p>
          <div class="actions">
            <button class="btn btn-warning" onclick="editPost('${post._id}','${escAttr(post.title)}','${escAttr(post.content)}','${escAttr(post.author)}')">Edit</button>
            <button class="btn btn-danger"  onclick="deletePost('${post._id}')">Delete</button>
          </div>
        </div>`;
    }

    // ── Edit (inline prompt demo) ────────────────────────────
    async function editPost(id, title, content, author) {
      const newTitle   = prompt('New title:',   title);   if (newTitle   === null) return;
      const newContent = prompt('New content:', content); if (newContent === null) return;
      const newAuthor  = prompt('New author:',  author);  if (newAuthor  === null) return;
      try {
        const res = await fetch(`${API}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: newTitle, content: newContent, author: newAuthor }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Unknown error');
        showStatus('✅ Post updated!', 'success');
        loadPosts();
      } catch (err) {
        showStatus(`❌ ${err.message}`, 'error');
      }
    }

    // ── Delete ───────────────────────────────────────────────
    async function deletePost(id) {
      if (!confirm('Delete this post?')) return;
      try {
        const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Unknown error');
        showStatus('🗑️ Post deleted.', 'success');
        loadPosts();
      } catch (err) {
        showStatus(`❌ ${err.message}`, 'error');
      }
    }

    // ── Helpers ──────────────────────────────────────────────
    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function escAttr(str) {
      return String(str).replace(/'/g,"\\'").replace(/"/g,'&quot;');
    }

    // Auto-load on page open
    loadPosts();
  </script>
</body>
</html>

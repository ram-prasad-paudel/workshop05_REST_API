<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home | Blog API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #333; }
    nav { background: #2563eb; padding: 1rem 2rem; display: flex; gap: 1.5rem; }
    nav a { color: #fff; text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 800px; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    p { line-height: 1.6; margin-bottom: 1rem; }
    .btn { display: inline-block; background: #2563eb; color: #fff; padding: .6rem 1.4rem; border-radius: 6px; text-decoration: none; font-weight: 600; }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
    <a href="/blog">Blog</a>
  </nav>
  <main>
    <h1>Welcome to Blog API 🚀</h1>
    <p>This is a simple REST API demo built with <strong>Express</strong> and <strong>MongoDB</strong>.</p>
    <p>Use the navigation above to explore pages, or head to the Blog page to interact with the API.</p>
    <a href="/blog" class="btn">View Blog Posts</a>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – Page Not Found | Blog API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    h1 { font-size: 6rem; color: #2563eb; }
    h2 { font-size: 1.8rem; margin-bottom: 1rem; }
    p  { margin-bottom: 1.5rem; color: #666; }
    a  { background: #2563eb; color: #fff; padding: .6rem 1.4rem; border-radius: 6px; text-decoration: none; font-weight: 600; }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>The page you're looking for doesn't exist.</p>
  <a href="/">← Back to Home</a>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Blog API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #333; }
    nav { background: #2563eb; padding: 1rem 2rem; display: flex; gap: 1.5rem; }
    nav a { color: #fff; text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 800px; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    p { line-height: 1.6; margin-bottom: 1rem; }
    form { display: flex; flex-direction: column; gap: .8rem; max-width: 480px; }
    input, textarea { padding: .6rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    textarea { resize: vertical; min-height: 120px; }
    button { background: #2563eb; color: #fff; border: none; padding: .7rem; border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: 600; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
    <a href="/blog">Blog</a>
  </nav>
  <main>
    <h1>Contact 📬</h1>
    <p>Have a question? Fill in the form below.</p>
    <form onsubmit="event.preventDefault(); alert('Message sent! (demo only)')">
      <input type="text" placeholder="Your name" required />
      <input type="email" placeholder="Your email" required />
      <textarea placeholder="Your message"></textarea>
      <button type="submit">Send Message</button>
    </form>
  </main>
</body>
</html>
